# Local development on macOS or Windows: the judge in a Linux container (see Dockerfile).
# Production does not use Docker; see deploy/ and the README.
services:
  judge:
    build: .
    ports:
      - "127.0.0.1:7777:7777"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    # As in production (deploy/openleet-judge.service): no swap, so a memory hog fails fast;
    # the kernel's OOM killer never picks the daemon or the zygote, only the solution
    # (zygote.py raises its score); and an init reaps orphans, which the daemon does not.
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: -1000
    init: true
