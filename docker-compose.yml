# Local development on macOS or Windows: the judge in a Linux container (see Dockerfile).
# Production does not use Docker; see deploy/ and the README.
services:
  judge:
    build: .
    ports:
      - "127.0.0.1:7777:7777"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
