# One command for OpenLeet in Docker: docker compose up -d, then http://openleet.localhost
# (HTTP_PORT=8088 docker compose up -d when port 80 is taken: http://openleet.localhost:8088).
# Production runs natively under systemd instead; see deploy/ and the README.
name: openleet

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  caddy:
    <<: *hardened
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs: [/data, /config]
    mem_limit: 64m
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *hardened
    image: ghcr.io/nsudhanva/openleet:latest
    build:
      context: .
      target: app
      args:
        JOBS: ${BUILD_JOBS:-4} # parallel compiles: DuckDB C++ needs ~1 GB each
    environment:
      SITE_ADDRESS: http://openleet.localhost
      HTTP_PORT: "8080"
      STATE_DIR: /state
      JUDGE_SOCKET: /run/openleet-judge/judge.sock
      JUDGE_CPU_SCALE: ${JUDGE_CPU_SCALE:-2.5}
      TZ: ${TZ:-UTC}
    volumes:
      - state:/state
      - judge-socket:/run/openleet-judge:ro
    mem_limit: 200m
    depends_on: [judge]

  judge: &judge
    <<: *hardened
    image: ghcr.io/nsudhanva/openleet-judge:latest
    build:
      context: .
      target: judge
      args:
        JOBS: ${BUILD_JOBS:-4}
    network_mode: none
    # Root in the container only to drop each submission to uid 61000.
    cap_add: [SETUID, SETGID, KILL]
    tmpfs: [/tmp:size=16m]
    volumes:
      - judge-socket:/run/openleet-judge
    pids_limit: 64
    mem_limit: 512m

  # For `cargo run` on the host (macOS has no Linux judge): the judge on 127.0.0.1:7777.
  # docker compose --profile dev up -d judge-dev
  judge-dev:
    <<: *judge
    profiles: [dev]
    network_mode: bridge
    environment:
      JUDGE_SOCKET: tcp://0.0.0.0:7777
    ports:
      - "127.0.0.1:7777:7777"
    volumes: []

volumes:
  state:
  judge-socket:
