[package]
name = "openleet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2"] }
# Pinned to the version rustls-acme implements its acceptor for.
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
duckdb = { version = "1.20000.1", features = ["bundled", "json"] }
jiff = "0.2.41"
openleet-proto = { version = "0.1.0", path = "../proto" }
mimalloc = "0.1.52"
parking_lot = "0.13.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls-acme = { version = "0.15.4", features = ["axum", "tokio", "aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal", "io-util"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-zstd", "compression-gzip", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
hmac = "0.13.0"
sha2 = "0.11.1"
sd-notify = "0.5.0"
async-trait = "0.1.92"
x509-parser = "0.18.1"
pem = "3.0.6"
tower = { version = "0.5.3", features = ["limit"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
base64 = "0.22.1"

[build-dependencies]
base64 = "0.22.1"
brotli = "9.1.1"
sha2 = "0.11.1"
zstd = "0.14.3"
