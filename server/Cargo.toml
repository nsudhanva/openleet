[package]
name = "openleet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["http2"] }
# Pinned to the version rustls-acme implements its acceptor for.
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
form_urlencoded = "1.2.2"
duckdb = { version = "1.20000.1", features = ["bundled", "json"] }
jiff = "0.2.42"
openleet-proto.workspace = true
mimalloc = "0.1.52"
parking_lot = "0.13.0"
rustls-acme = { version = "0.15.4", features = ["axum", "tokio", "aws-lc-rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal", "io-util"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-zstd", "compression-gzip", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
hmac = "0.13.0"
sha2.workspace = true
sd-notify = "0.5.0"
socket2 = { version = "0.6.5", features = ["all"] }
async-trait = "0.1.92"
x509-parser = "0.18.1"
pem = "3.0.6"
tower = { version = "0.5.3", features = ["limit"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
base64 = "0.22.1"

[dev-dependencies]
brotli = "9.1.1"
zstd = "0.14.3"

[build-dependencies]
base64 = "0.22.1"
brotli = "9.1.1"
# Without the workspace's extra features, so build scripts that share them (libduckdb-sys)
# are not rebuilt over their cached output.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zstd = "0.14.3"
