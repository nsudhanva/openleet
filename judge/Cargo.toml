[package]
name = "judge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
judge-proto = { version = "0.1.0", path = "../proto" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "process", "time", "sync", "signal"] }
