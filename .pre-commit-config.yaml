# Git hooks, run by prek (`uv run prek install`; pre-commit compatible).
# pre-commit: fast fixers and linters on the staged files only.
# pre-push: the same on the pushed files, plus whole-repo type checks, clippy and tests.
# Run everything by hand with `uv run prek run --all-files --hook-stage pre-push`; CI runs exactly
# that. Every tool comes from a lockfile: uv.lock (ruff, ty, shellcheck, actionlint, prek),
# bun.lock (biome, markdownlint-cli2, tsc) and rust-toolchain.toml (cargo fmt, clippy).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
exclude: ^(data/|web/src/routeTree\.gen\.ts$)

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(\.zed/|web/tsconfig\.json$|.*\.jsonc$)
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: biome
        name: biome (format + lint)
        entry: bun x --no-install biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: uv-lock
        name: uv.lock up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: judge-requirements
        name: judge/py/requirements.txt from pyproject.toml
        entry: uv export --frozen --quiet --only-group judge --no-emit-project -o judge/py/requirements.txt
        language: system
        files: ^(pyproject\.toml|uv\.lock|judge/py/requirements\.txt)$
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        entry: bun x --no-install markdownlint-cli2
        language: system
        types: [markdown]
      - id: shellcheck
        name: shellcheck
        entry: uv run shellcheck
        language: system
        types: [shell]
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/

      - id: tsc
        name: tsc
        entry: bun run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: tests
        name: tests (cargo, Python, vitest)
        entry: sh -c 'cargo test --locked -q && uv run python -m unittest discover -s judge/py && uv run python -m unittest discover -s deploy && bun run test'
        language: system
        pass_filenames: false
        stages: [pre-push]
