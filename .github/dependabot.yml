# Weekly dependency updates, one pull request per ecosystem. The Rust and Python DuckDB stay on
# the same minor version: the server's tests fail on a pull request that moves only one of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # The root package.json and its web workspace share one bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
