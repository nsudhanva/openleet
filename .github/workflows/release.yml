# Every push to main is checked, built, published as the "edge" release and deployed: CI sends a
# signed POST /api/deploy, systemd runs deploy/update.sh as root, and the job ends when
# /api/version reports the new revision. The archive holds bin/openleet (web app embedded),
# bin/openleet-judge, the judge's Python, the data and deploy/ (units and scripts).
#
# Whoever can write the edge release gets root on the server, so only the small `release` job
# holds a token that can: `build` (which runs the repo's code and its dependencies) reads only.
# Actions are pinned to commit SHAs; the comment names the release.
name: release

on:
  push:
    branches: [main]
    paths:
      - server/**
      - judge/**
      - proto/**
      - web/**
      - data/problems.json
      - data/approaches.json
      - data/judge/**
      - deploy/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - bun.lock
      - biome.json
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cached build takes minutes; a cold one (new Rust toolchain, emptied cache) about 45:
    # checks and tests 25 to 30, the release build another 15.
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.package.outputs.revision }}
    env:
      # Every GCP e2 machine has AVX2.
      RUSTFLAGS: -C target-cpu=x86-64-v3
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.8
          enable-cache: true
      - name: Rust toolchain
        # The version and components in rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Drop the cached DuckDB sources
        # rust-cache keeps target/duckdb-sources as directories without their files, the
        # `.complete` marker included, and libduckdb-sys then fails to unpack over the
        # incomplete tree ("Directory not empty"). Unpacking again takes seconds.
        run: rm -rf target/duckdb-sources
      - name: Install dependencies
        # No lifecycle scripts: nothing the web app needs has one.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          uv sync --locked
      - name: Web app
        # Before the Rust checks: the server embeds web/dist.
        run: bun run build
      - name: Test corpus
        # tests.duckdb is too big for git; corpus.json names the repository whose "corpus"
        # release holds it, the asset and its sha256.
        run: |
          repository=$(jq -r .repository data/judge/corpus.json)
          asset=$(jq -r .asset data/judge/corpus.json)
          sha256=$(jq -r .sha256 data/judge/corpus.json)
          curl -fsSL --retry 3 -o data/judge/tests.duckdb \
            "https://github.com/$repository/releases/download/corpus/$asset"
          echo "$sha256  data/judge/tests.duckdb" | sha256sum -c -
      - name: Checks and tests
        # Exactly the git hooks (.pre-commit-config.yaml): linters, type checks, clippy, tests.
        run: uv run prek run --all-files --hook-stage pre-push --show-diff-on-failure
      - name: Build
        run: cargo build --locked --release --bins
      - name: Package
        id: package
        run: |
          rev=${GITHUB_SHA::12}
          out=dist/openleet
          mkdir -p "$out/bin" "$out/data" "$out/judge"
          cp target/release/openleet target/release/openleet-judge "$out/bin/"
          cp data/problems.json data/approaches.json "$out/data/"
          cp -r data/judge "$out/data/judge"
          cp -r judge/py "$out/judge/py"
          cp -r deploy "$out/deploy"
          echo "$rev" > dist/REVISION
          cp dist/REVISION "$out/REVISION"
          tar --zstd -cf "dist/openleet-$rev.tar.zst" -C "$out" .
          (cd dist && sha256sum "openleet-$rev.tar.zst" > "openleet-$rev.tar.zst.sha256")
          rm -rf "$out"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REV: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view edge >/dev/null 2>&1 ||
            gh release create edge --prerelease --title edge --notes "Latest build of main."
          # The archive first, REVISION last: the server only follows REVISION.
          gh release upload edge "dist/openleet-$REV.tar.zst" "dist/openleet-$REV.tar.zst.sha256" --clobber
          gh release upload edge dist/REVISION --clobber
          # Keep the archives of the last three builds.
          gh release view edge --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name' |
            grep '^openleet-.*\.tar\.zst$' | tail -n +4 |
            while read -r name; do
              gh release delete-asset edge "$name" -y
              gh release delete-asset edge "$name.sha256" -y || true
            done
      - name: Deploy and wait until live
        # The repository variable SITE_URL names the server; without it, releases are only
        # published, and servers pick them up with their 5-minute update timer.
        if: vars.SITE_URL != ''
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SITE: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then echo "::error::the DEPLOY_SECRET secret is not set"; exit 1; fi
          body="{\"revision\":\"$REV\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -r | cut -d' ' -f1)
          curl -fsS --max-time 30 -X POST "$SITE/api/deploy" -H "content-type: application/json" \
            -H "x-deploy-signature: sha256=$signature" --data "$body"
          live=
          for _ in $(seq 60); do
            live=$(curl -fsS --max-time 10 "$SITE/api/version" | jq -r .revision || true)
            if [ "$live" = "$REV" ]; then echo "live: $REV"; exit 0; fi
            sleep 5
          done
          echo "::error::revision $REV is not live after 5 minutes (still ${live:-unknown})"
          exit 1
