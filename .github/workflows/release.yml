# Builds the native release on every push to main and publishes it as the "edge" GitHub
# release; the server's timer (deploy/update.sh) installs it within about five minutes.
# The archive holds bin/cards (web app embedded), bin/judge, the judge's Python, the data and
# deploy/ (systemd units and scripts, which update themselves on the server).
name: release

on:
  push:
    branches: [main]
    paths:
      - server/**
      - judge/**
      - proto/**
      - web/**
      - data/problems.json
      - data/approaches.json
      - data/judge/**
      - deploy/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - bun.lock
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # Every GCP e2 machine has AVX2.
      RUSTFLAGS: -C target-cpu=x86-64-v3
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Web app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run typecheck
          bun run test
          bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test and build
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --bins
      - name: Package
        run: |
          rev=${GITHUB_SHA::12}
          out=dist/google-cards
          mkdir -p "$out/bin" "$out/data" "$out/judge"
          cp target/release/cards target/release/judge "$out/bin/"
          cp data/problems.json data/approaches.json "$out/data/"
          cp -r data/judge "$out/data/judge"
          cp -r judge/py "$out/judge/py"
          cp -r deploy "$out/deploy"
          echo "$rev" > "$out/REVISION"
          echo "$rev" > dist/REVISION
          tar --zstd -cf "dist/google-cards-$rev.tar.zst" -C "$out" .
          (cd dist && sha256sum "google-cards-$rev.tar.zst" > "google-cards-$rev.tar.zst.sha256")
          echo "REV=$rev" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge >/dev/null 2>&1 || \
            gh release create edge --prerelease --title "edge" --notes "Latest build of main."
          # The archive first, REVISION last: the server only follows REVISION.
          gh release upload edge "dist/google-cards-$REV.tar.zst" "dist/google-cards-$REV.tar.zst.sha256" --clobber
          gh release upload edge dist/REVISION --clobber
          # Keep the archives of the last three builds.
          gh release view edge --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name' \
            | grep '^google-cards-.*\.tar\.zst$' | tail -n +4 \
            | while read -r name; do gh release delete-asset edge "$name" -y; gh release delete-asset edge "$name.sha256" -y || true; done
