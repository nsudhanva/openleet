# CI/CD: every push to main is checked, built natively, published as the "edge" GitHub release
# and deployed. CI asks the server to update (a signed POST /api/deploy); systemd then runs
# deploy/update.sh as root, which installs the release and restarts the services without
# dropping connections. The job ends when /api/version reports the new revision.
# The archive holds bin/openleet (web app embedded), bin/openleet-judge, the judge's Python, the data and
# deploy/ (systemd units and scripts, which update themselves on the server).
name: release

on:
  push:
    branches: [main]
    paths:
      - server/**
      - judge/**
      - proto/**
      - web/**
      - data/problems.json
      - data/approaches.json
      - data/judge/**
      - deploy/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - bun.lock
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # Every GCP e2 machine has AVX2.
      RUSTFLAGS: -C target-cpu=x86-64-v3
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Web app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run typecheck
          bun run test
          bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test and build
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --bins
      - name: Package
        run: |
          rev=${GITHUB_SHA::12}
          out=dist/openleet
          mkdir -p "$out/bin" "$out/data" "$out/judge"
          cp target/release/openleet target/release/openleet-judge "$out/bin/"
          cp data/problems.json data/approaches.json "$out/data/"
          cp -r data/judge "$out/data/judge"
          cp -r judge/py "$out/judge/py"
          cp -r deploy "$out/deploy"
          echo "$rev" > "$out/REVISION"
          echo "$rev" > dist/REVISION
          tar --zstd -cf "dist/openleet-$rev.tar.zst" -C "$out" .
          (cd dist && sha256sum "openleet-$rev.tar.zst" > "openleet-$rev.tar.zst.sha256")
          echo "REV=$rev" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge >/dev/null 2>&1 || \
            gh release create edge --prerelease --title "edge" --notes "Latest build of main."
          # The archive first, REVISION last: the server only follows REVISION.
          gh release upload edge "dist/openleet-$REV.tar.zst" "dist/openleet-$REV.tar.zst.sha256" --clobber
          gh release upload edge dist/REVISION --clobber
          # Keep the archives of the last three builds.
          gh release view edge --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name' \
            | grep '^openleet-.*\.tar\.zst$' | tail -n +4 \
            | while read -r name; do gh release delete-asset edge "$name" -y; gh release delete-asset edge "$name.sha256" -y || true; done
      - name: Deploy and wait until live
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SITE: https://openleet.sudhanva.me
        run: |
          body="{\"revision\":\"$REV\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -r | cut -d' ' -f1)
          curl -fsS -X POST "$SITE/api/deploy" -H "content-type: application/json" \
            -H "x-deploy-signature: sha256=$signature" --data "$body"
          for _ in $(seq 60); do
            live=$(curl -fsS "$SITE/api/version" | jq -r .revision || true)
            if [ "$live" = "$REV" ]; then echo "live: $REV"; exit 0; fi
            sleep 5
          done
          echo "revision $REV is not live after 5 minutes (still $live)"
          exit 1
