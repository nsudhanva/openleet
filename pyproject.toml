[project]
name = "openleet"
version = "0.1.0"
description = "OpenLeet data tools: problem lists, approaches, judge tests"
readme = "README.md"
authors = [{ name = "Sudhanva Narayana", email = "nsudhanva@gmail.com" }]
requires-python = ">=3.15"
# The corpus this writes (data/judge/tests.duckdb) is read by the server's bundled DuckDB: keep
# the same minor version as the duckdb crate in server/Cargo.toml (the server's tests check it).
dependencies = [
    "duckdb==2.0.*",
]

[project.scripts]
openleet = "openleet:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "debugpy>=1.8.22",
    "prek>=0.5.10",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "ty>=0.0.100",
    { include-group = "judge" },
]
# The packages the judge's Python offers submissions beyond the standard library (see
# judge/py/prelude.py). The judge (deploy/install.sh, the Dockerfile, `openleet judge`) installs
# them from judge/py/requirements.txt, which the judge-requirements git hook exports from this
# group and uv.lock: change them here only.
judge = [
    "sortedcontainers==2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "judge/py"]
